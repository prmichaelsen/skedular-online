name = "skedular"
main = "src/server.ts"
compatibility_date = "2026-03-12"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "skedular.online/*", zone_name = "skedular.online" },
  { pattern = "www.skedular.online/*", zone_name = "skedular.online" },
]

[placement]
mode = "smart"

[limits]
cpu_ms = 300000

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# Rate Limiters
[[unsafe.bindings]]
name = "AUTH_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[unsafe.bindings]]
name = "API_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 100, period = 60 }

